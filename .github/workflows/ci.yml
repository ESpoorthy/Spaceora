name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spaceora_test
          POSTGRES_USER: spaceora
          POSTGRES_PASSWORD: spaceora_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceora -d spaceora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and run all tests (including Flyway migration tests against PostgreSQL)
        working-directory: backend
        run: ./mvnw clean verify -Dspring.profiles.active=test
        env:
          # Testcontainers will use the Docker socket available on GitHub-hosted runners.
          # The postgres service above satisfies any direct JDBC use; Testcontainers
          # spins its own container using the GitHub runner's Docker daemon.
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
