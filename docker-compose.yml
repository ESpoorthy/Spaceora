version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spaceora_postgres
    environment:
      POSTGRES_DB: spaceora_dev
      POSTGRES_USER: ${DB_USERNAME:-spaceora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - spaceora_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  spaceora_pg_data:
