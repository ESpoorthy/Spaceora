spring:
  application:
    name: spaceora-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spaceora_dev}
    username: ${DB_USERNAME:spaceora}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
jwt:
  # JWT_SECRET must be set in the environment. No default is provided so the
  # application fails fast at startup rather than launching with a known secret.
  secret: ${JWT_SECRET}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
