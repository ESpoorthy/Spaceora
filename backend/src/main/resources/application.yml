spring:
  application:
    name: spaceora-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spaceora_dev}
    username: ${DB_USERNAME:spaceora}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-256-bits}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
